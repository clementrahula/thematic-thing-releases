name: ChatGPT Sign YouTube Background macOS

on:
  create:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  build:
    if: (github.event_name == 'create' && github.event.ref_type == 'branch' && startsWith(github.event.ref, 'shortcut-macos-trigger-')) || (github.event_name == 'issues' && startsWith(github.event.issue.title, 'shortcut-macos-trigger-'))
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build unsigned shortcut
        run: |
          python3 - <<'PY'
          import plistlib
          import tools.build_youtube_background_shortcut as b
          b.OUT = 'dist/YouTube-Background.unsigned.shortcut'
          b.sign_with_hubsign = lambda shortcut: plistlib.dumps(shortcut, fmt=plistlib.FMT_BINARY)
          b.main()
          PY
      - name: Sign with macOS Shortcuts
        run: |
          shortcuts sign -i dist/YouTube-Background.unsigned.shortcut -o dist/YouTube-Background.shortcut -m anyone
      - name: Verify signature
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('dist/YouTube-Background.shortcut')
          data = p.read_bytes()
          print('size', len(data), 'magic', data[:4])
          assert data[:4] == b'AEA1'
          PY
      - name: Publish signed shortcut to repository
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f dist/YouTube-Background.shortcut
          git commit -m "Publish Apple-signed YouTube Background shortcut" || exit 0
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: YouTube-Background-macOS-signed
          path: dist/YouTube-Background.shortcut
          if-no-files-found: error
