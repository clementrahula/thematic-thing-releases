name: Build YouTube Background Shortcut

on:
  push:
    branches:
      - chatgpt-youtube-background-20260912
    paths:
      - tools/build_youtube_background_shortcut.py
      - .github/workflows/build-youtube-background-shortcut.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and sign shortcut
        run: python3 tools/build_youtube_background_shortcut.py
      - name: Verify signed shortcut
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('dist/YouTube-Background.shortcut')
          data = p.read_bytes()
          assert data[:4] == b'AEA1', data[:16]
          print(p, len(data), data[:4])
          PY
      - name: Commit signed shortcut
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/YouTube-Background.shortcut
          git diff --cached --quiet && exit 0
          git commit -m 'Build signed YouTube Background shortcut [skip ci]'
          git push
