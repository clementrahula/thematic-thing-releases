name: ChatGPT Build YouTube Background

on:
  create:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: (github.event_name == 'create' && github.event.ref_type == 'branch' && startsWith(github.event.ref, 'shortcut-build-trigger-')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Match current Cherri signing request
        run: |
          sed -i '/"Origin":/d; /"Referer":/d; s/cherri\/1.0/cherri\/2.3.0/' tools/build_youtube_background_shortcut.py
      - name: Build and sign shortcut
        run: |
          for attempt in 1 2 3 4 5 6; do
            echo "Signing attempt $attempt"
            if python3 tools/build_youtube_background_shortcut.py; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1
      - name: Verify signed shortcut
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('dist/YouTube-Background.shortcut')
          data = p.read_bytes()
          assert data[:4] == b'AEA1', data[:16]
          print(p, len(data), data[:4])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: YouTube-Background
          path: dist/YouTube-Background.shortcut
          if-no-files-found: error
