name: ChatGPT Build YouTube Background

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: startsWith(github.event.issue.title, '[shortcut-build]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and sign shortcut
        run: python3 tools/build_youtube_background_shortcut.py
      - name: Verify signed shortcut
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('dist/YouTube-Background.shortcut')
          data = p.read_bytes()
          assert data[:4] == b'AEA1', data[:16]
          print(p, len(data), data[:4])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: YouTube-Background
          path: dist/YouTube-Background.shortcut
          if-no-files-found: error
